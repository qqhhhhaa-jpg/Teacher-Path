<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="g_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d1fae5"/>
      <stop offset="100%" stop-color="#a7f3d0"/>
    </linearGradient>
    <linearGradient id="g_green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="g_cap" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="g_shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#10b981" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect x="15" y="15" width="130" height="130" rx="36" fill="url(#g_bg)"/>
  <!-- Graduation Cap (Mortarboard) -->
  <g filter="url(#g_shadow)">
    <!-- Cap Rhombus Top -->
    <polygon points="80,36 126,54 80,72 34,54" fill="url(#g_cap)"/>
    <!-- Cap Under Skullcap -->
    <path d="M52 62 L52 78 C52 90, 108 90, 108 78 L108 62 Z" fill="#334155"/>
    <!-- Golden Tassel -->
    <circle cx="80" cy="54" r="3.5" fill="#f59e0b"/>
    <path d="M80 54 Q100 62 104 80" fill="none" stroke="#f59e0b" stroke-width="2.5"/>
    <circle cx="104" cy="83" r="3.5" fill="#d97706"/>
  </g>
  <!-- Ascending Bar Chart Below -->
  <g transform="translate(42, 92)" filter="url(#g_shadow)">
    <rect x="0" y="24" width="14" height="16" rx="4" fill="#6ee7b7"/>
    <rect x="20" y="14" width="14" height="26" rx="4" fill="#34d399"/>
    <rect x="40" y="4" width="14" height="36" rx="4" fill="url(#g_green)"/>
    <rect x="60" y="-4" width="14" height="44" rx="4" fill="#047857"/>
    <!-- Star on top of best bar -->
    <path d="M67 -12 L69 -7 L74 -7 L70 -3 L72 2 L67 -1 L62 2 L64 -3 L60 -7 L65 -7 Z" fill="#f59e0b"/>
  </g>
</svg>