<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="r_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0e7ff"/>
      <stop offset="100%" stop-color="#c7d2fe"/>
    </linearGradient>
    <linearGradient id="r_indigo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
    <linearGradient id="r_cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
    <linearGradient id="r_amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="r_shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#6366f1" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect x="15" y="15" width="130" height="130" rx="36" fill="url(#r_bg)"/>
  <!-- 3D Pie Chart -->
  <g transform="translate(80, 78)" filter="url(#r_shadow)">
    <!-- Slice 1 (Indigo 50%) -->
    <path d="M0,0 L0,-38 A38,38 0 0,1 38,0 Z" fill="url(#r_indigo)"/>
    <!-- Slice 2 (Cyan 35%) -->
    <path d="M0,0 L38,0 A38,38 0 0,1 -26.8,26.8 Z" fill="url(#r_cyan)"/>
    <!-- Slice 3 (Amber 15% - separated/floating) -->
    <g transform="translate(-4, -4)">
      <path d="M0,0 L-26.8,26.8 A38,38 0 0,1 0,-38 Z" fill="url(#r_amber)"/>
    </g>
    <!-- Center Donut hole -->
    <circle cx="0" cy="0" r="15" fill="#ffffff"/>
    <circle cx="0" cy="0" r="8" fill="#e0e7ff"/>
  </g>
  <!-- Data Node Indicators -->
  <g filter="url(#r_shadow)">
    <circle cx="42" cy="42" r="7" fill="#6366f1"/>
    <circle cx="42" cy="42" r="3.5" fill="#ffffff"/>
    <circle cx="120" cy="116" r="7" fill="#f59e0b"/>
    <circle cx="120" cy="116" r="3.5" fill="#ffffff"/>
  </g>
</svg>