<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="cert_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>
    <linearGradient id="cert_paper" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fffbeb"/>
    </linearGradient>
    <linearGradient id="cert_gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="cert_red" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <filter id="cert_shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#b45309" flood-opacity="0.28"/>
    </filter>
  </defs>
  
  <!-- Rounded Base Background -->
  <rect x="15" y="15" width="130" height="130" rx="36" fill="url(#cert_bg)"/>
  
  <!-- Certificate Document Body -->
  <g filter="url(#cert_shadow)">
    <rect x="30" y="32" width="100" height="74" rx="8" fill="url(#cert_paper)" stroke="url(#cert_gold)" stroke-width="2.5"/>
    <rect x="35" y="37" width="90" height="64" rx="5" fill="none" stroke="#d97706" stroke-width="0.8" stroke-dasharray="3,2"/>
    
    <!-- Header Lines & Embellishments -->
    <line x1="50" y1="47" x2="110" y2="47" stroke="url(#cert_gold)" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="58" y1="54" x2="102" y2="54" stroke="#d97706" stroke-width="1.5" stroke-linecap="round"/>
    
    <!-- Body Text Lines -->
    <line x1="44" y1="65" x2="116" y2="65" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
    <line x1="48" y1="73" x2="112" y2="73" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
    <line x1="54" y1="81" x2="86" y2="81" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
  </g>
  
  <!-- Golden Wax Seal & Red Honor Ribbons -->
  <g transform="translate(100, 84)" filter="url(#cert_shadow)">
    <!-- Red Ribbons -->
    <polygon points="12,18 20,44 10,38 0,44 8,18" fill="url(#cert_red)"/>
    <polygon points="12,18 24,42 16,36 8,42 12,18" fill="#991b1b" opacity="0.6"/>
    
    <!-- Golden Medal Outer Star Burst -->
    <circle cx="10" cy="12" r="16" fill="url(#cert_gold)"/>
    <circle cx="10" cy="12" r="13" fill="#ffffff" opacity="0.25"/>
    <circle cx="10" cy="12" r="11" fill="url(#cert_gold)"/>
    
    <!-- Central Star -->
    <path d="M10,4 L12,9 L17,9 L13,12 L15,17 L10,14 L5,17 L7,12 L3,9 L8,9 Z" fill="#ffffff"/>
  </g>
  
  <!-- Rolled Diploma Scroll with Golden Ribbon on Lower Left -->
  <g transform="translate(32, 104)" filter="url(#cert_shadow)">
    <rect x="0" y="4" width="46" height="12" rx="4" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2"/>
    <ellipse cx="44" cy="10" rx="3" ry="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="18" y="2" width="8" height="16" rx="2" fill="url(#cert_gold)"/>
  </g>
</svg>
