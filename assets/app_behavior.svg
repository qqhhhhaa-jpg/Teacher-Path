<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="b_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cffafe"/>
      <stop offset="100%" stop-color="#a5f3fc"/>
    </linearGradient>
    <linearGradient id="b_teal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0e7490"/>
    </linearGradient>
    <filter id="b_shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0891b2" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect x="15" y="15" width="130" height="130" rx="36" fill="url(#b_bg)"/>
  <!-- ID / Conduct Card -->
  <g filter="url(#b_shadow)">
    <rect x="36" y="34" width="88" height="92" rx="16" fill="#ffffff" stroke="#a5f3fc" stroke-width="2"/>
    <!-- Header stripe -->
    <rect x="36" y="34" width="88" height="22" rx="14" fill="url(#b_teal)"/>
    <!-- Student Avatar -->
    <circle cx="80" cy="54" r="16" fill="#ffffff" stroke="#cffafe" stroke-width="3"/>
    <circle cx="80" cy="50" r="6.5" fill="url(#b_teal)"/>
    <path d="M69 66 C69 59, 91 59, 91 66 Z" fill="url(#b_teal)"/>
    <!-- Checklist items with checkmarks -->
    <circle cx="52" cy="80" r="5" fill="#10b981"/>
    <path d="M49 80 L51 82 L55 78" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/>
    <rect x="63" y="78" width="46" height="4" rx="2" fill="#cbd5e1"/>

    <circle cx="52" cy="95" r="5" fill="#10b981"/>
    <path d="M49 95 L51 97 L55 93" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/>
    <rect x="63" y="93" width="38" height="4" rx="2" fill="#cbd5e1"/>

    <circle cx="52" cy="110" r="5" fill="#3b82f6"/>
    <path d="M49 110 L51 112 L55 108" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/>
    <rect x="63" y="108" width="42" height="4" rx="2" fill="#cbd5e1"/>
  </g>
  <!-- Golden Award Medal -->
  <g transform="translate(102, 85)" filter="url(#b_shadow)">
    <circle cx="14" cy="14" r="14" fill="#f59e0b"/>
    <circle cx="14" cy="14" r="10" fill="#fbbf24"/>
    <path d="M14 8 L15.5 11 L19 11.5 L16.5 14 L17.2 17.5 L14 15.8 L10.8 17.5 L11.5 14 L9 11.5 L12.5 11 Z" fill="#ffffff"/>
  </g>
</svg>