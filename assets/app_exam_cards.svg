<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Radial Ambient Glow -->
    <radialGradient id="badgeGlow" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#312e81" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>

    <!-- Card Body Metallic Gradient -->
    <linearGradient id="cardBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#eef2ff" />
    </linearGradient>

    <!-- Header Royal Gradient (Deep Indigo to Navy) -->
    <linearGradient id="headerRoyal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312e81" />
      <stop offset="50%" stop-color="#3730a3" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Gold Accent Gradients -->
    <linearGradient id="goldMetallic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="35%" stop-color="#facc15" />
      <stop offset="70%" stop-color="#ca8a04" />
      <stop offset="100%" stop-color="#854d0e" />
    </linearGradient>

    <linearGradient id="ribbonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4338ca" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#3730a3" />
    </linearGradient>

    <!-- Shadows -->
    <filter id="cardDeepShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#1e1b4b" flood-opacity="0.35" />
    </filter>
    <filter id="photoShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.2" />
    </filter>
    <filter id="glowStamp" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#ca8a04" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Ambient Backdrop Glow -->
  <rect width="512" height="512" rx="44" fill="url(#badgeGlow)" />

  <!-- Security Guilloche Pattern Curves (Background Security Watermark) -->
  <g stroke="#6366f1" stroke-opacity="0.08" stroke-width="1.2" fill="none">
    <ellipse cx="256" cy="256" rx="220" ry="140" transform="rotate(-15 256 256)" />
    <ellipse cx="256" cy="256" rx="200" ry="120" transform="rotate(15 256 256)" />
    <ellipse cx="256" cy="256" rx="240" ry="160" transform="rotate(-30 256 256)" />
    <circle cx="256" cy="256" r="180" stroke-dasharray="8,6" />
    <circle cx="256" cy="256" r="220" stroke-dasharray="4,8" />
  </g>

  <!-- Lanyard Ribbon Straps (Hanging from top) -->
  <g opacity="0.9">
    <path d="M226,0 L244,70 L256,70 L256,0 Z" fill="url(#ribbonGrad)" />
    <path d="M286,0 L268,70 L256,70 L256,0 Z" fill="#312e81" />
    <!-- Metallic Clip / Swivel Hook -->
    <rect x="238" y="66" width="36" height="14" rx="4" fill="url(#goldMetallic)" stroke="#854d0e" stroke-width="1" />
    <path d="M246,80 L266,80 L261,102 L251,102 Z" fill="#94a3b8" stroke="#64748b" stroke-width="1" />
    <circle cx="256" cy="106" r="6" fill="none" stroke="#64748b" stroke-width="3" />
  </g>

  <!-- Main Exam ID Card Body (Slanted 3D Perspective) -->
  <g filter="url(#cardDeepShadow)">
    <!-- Base Card Container -->
    <rect x="86" y="100" width="340" height="370" rx="24" fill="url(#cardBgGrad)" stroke="url(#goldMetallic)" stroke-width="3" />

    <!-- Security Micro-Border Inner Frame -->
    <rect x="94" y="108" width="324" height="354" rx="18" fill="none" stroke="#c7d2fe" stroke-width="1.5" stroke-dasharray="5,3" />

    <!-- Lanyard Punch Hole Slot -->
    <rect x="236" y="114" width="40" height="10" rx="5" fill="#0f172a" opacity="0.15" />
    <rect x="238" y="115" width="36" height="8" rx="4" fill="#1e1b4b" opacity="0.3" />

    <!-- Official Header Banner -->
    <rect x="98" y="132" width="316" height="68" rx="14" fill="url(#headerRoyal)" />
    
    <!-- Gold Trim at Header Bottom -->
    <line x1="98" y1="200" x2="414" y2="200" stroke="url(#goldMetallic)" stroke-width="3" />

    <!-- Iraqi Ministry Eagle Emblem / Crest Silhouette in Gold -->
    <g transform="translate(112, 142)">
      <!-- Golden Emblem Circle -->
      <circle cx="24" cy="24" r="22" fill="url(#goldMetallic)" />
      <circle cx="24" cy="24" r="19" fill="#1e1b4b" />
      <!-- Star & Wings Icon -->
      <path d="M24,12 L26.5,19 L33,19 L28,23 L30,30 L24,26 L18,30 L20,23 L15,19 L21.5,19 Z" fill="url(#goldMetallic)" />
    </g>

    <!-- Header Text (Arabic Official Title) -->
    <text x="250" y="156" font-family="'Cairo', sans-serif" font-weight="900" font-size="15" fill="#fef08a" text-anchor="middle">وزارة التربية والتعليم</text>
    <text x="250" y="174" font-family="'Cairo', sans-serif" font-weight="900" font-size="18" fill="#ffffff" text-anchor="middle">البطاقة الامتحانية الرسمية</text>
    <text x="250" y="190" font-family="'Cairo', sans-serif" font-weight="700" font-size="11" fill="#c7d2fe" text-anchor="middle">امتحانات نصف السنة • الدور الأول</text>

    <!-- Exam Year Pill Tag (Top Right) -->
    <rect x="340" y="142" width="62" height="20" rx="10" fill="rgba(255,255,255,0.15)" stroke="url(#goldMetallic)" stroke-width="1" />
    <text x="371" y="156" font-family="'Cairo', sans-serif" font-weight="800" font-size="9" fill="#ffffff" text-anchor="middle">2024 - 2025</text>

    <!-- Student Photo Box (Left) -->
    <g transform="translate(112, 216)" filter="url(#photoShadow)">
      <rect x="0" y="0" width="86" height="106" rx="10" fill="#ffffff" stroke="url(#goldMetallic)" stroke-width="2.5" />
      <!-- Photo Area -->
      <rect x="4" y="4" width="78" height="98" rx="8" fill="#e0e7ff" />
      <!-- Student Silhouette Avatar -->
      <circle cx="43" cy="40" r="18" fill="#4338ca" />
      <path d="M19,86 C19,65 30,58 43,58 C56,58 67,65 67,86 Z" fill="#312e81" />
      <!-- Photo Hologram Watermark Badge -->
      <circle cx="70" cy="88" r="10" fill="url(#goldMetallic)" opacity="0.9" />
      <path d="M70,82 L72,86 L76,86 L73,89 L74,93 L70,90 L66,93 L67,89 L64,86 L68,86 Z" fill="#ffffff" />
    </g>

    <!-- Student Metadata Details (Right) -->
    <g transform="translate(210, 216)">
      <!-- Label: Student Name -->
      <text x="195" y="14" font-family="'Cairo', sans-serif" font-weight="800" font-size="10" fill="#6366f1" text-anchor="end">اسم الطالب الرباعي:</text>
      <text x="195" y="34" font-family="'Cairo', sans-serif" font-weight="900" font-size="15" fill="#0f172a" text-anchor="end">أحمد حيدر عبد الحسين</text>

      <!-- Exam Roll Number Prominent Badge -->
      <rect x="25" y="44" width="170" height="34" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.8" />
      <text x="185" y="65" font-family="'Cairo', sans-serif" font-weight="800" font-size="10" fill="#4338ca" text-anchor="end">الرقم الامتحاني:</text>
      <text x="80" y="67" font-family="monospace, system-ui" font-weight="900" font-size="16" fill="#1e1b4b" text-anchor="middle" letter-spacing="2">102488</text>

      <!-- Grade & Hall Row -->
      <g transform="translate(0, 86)">
        <rect x="105" y="0" width="90" height="22" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" />
        <text x="150" y="15" font-family="'Cairo', sans-serif" font-weight="800" font-size="10" fill="#334155" text-anchor="middle">الثالث متوسط (أ)</text>

        <rect x="5" y="0" width="90" height="22" rx="6" fill="#ecfdf5" stroke="#10b981" stroke-width="1" />
        <text x="50" y="15" font-family="'Cairo', sans-serif" font-weight="800" font-size="10" fill="#047857" text-anchor="middle">القاعة (1) • مقعد 08</text>
      </g>
    </g>

    <!-- Micro Exam Schedule / Barcode Strip (Middle Section) -->
    <g transform="translate(112, 332)">
      <rect x="0" y="0" width="288" height="66" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.2" />
      
      <!-- Mini Timetable Header -->
      <rect x="0" y="0" width="288" height="20" rx="8" fill="#e2e8f0" />
      <text x="240" y="14" font-family="'Cairo', sans-serif" font-weight="800" font-size="9" fill="#475569" text-anchor="middle">المادة الامتحانية</text>
      <text x="144" y="14" font-family="'Cairo', sans-serif" font-weight="800" font-size="9" fill="#475569" text-anchor="middle">اليوم والتاريخ</text>
      <text x="48" y="14" font-family="'Cairo', sans-serif" font-weight="800" font-size="9" fill="#475569" text-anchor="middle">توقيع المراقب</text>

      <!-- Mini Timetable Sample Row -->
      <line x1="0" y1="36" x2="288" y2="36" stroke="#f1f5f9" stroke-width="1" />
      <text x="240" y="30" font-family="'Cairo', sans-serif" font-weight="800" font-size="9" fill="#0f172a" text-anchor="middle">الرياضيات والعلوم</text>
      <text x="144" y="30" font-family="'Cairo', sans-serif" font-weight="700" font-size="9" fill="#64748b" text-anchor="middle">الأحد 15 / 01</text>
      <text x="48" y="30" font-family="'Cairo', sans-serif" font-weight="700" font-size="8.5" fill="#94a3b8" text-anchor="middle">موقّع رسمي</text>

      <!-- Mini Timetable Row 2 -->
      <text x="240" y="52" font-family="'Cairo', sans-serif" font-weight="800" font-size="9" fill="#0f172a" text-anchor="middle">اللغة العربية والتربية</text>
      <text x="144" y="52" font-family="'Cairo', sans-serif" font-weight="700" font-size="9" fill="#64748b" text-anchor="middle">الثلاثاء 17 / 01</text>
      <text x="48" y="52" font-family="'Cairo', sans-serif" font-weight="700" font-size="8.5" fill="#94a3b8" text-anchor="middle">موقّع رسمي</text>
    </g>

    <!-- Bottom Verification Strip (QR + Barcode + Official Gold Seal) -->
    <g transform="translate(112, 406)">
      <!-- QR Code Matrix Box (Right) -->
      <rect x="0" y="0" width="50" height="50" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
      <!-- Simulated QR pattern -->
      <g fill="#1e1b4b">
        <rect x="4" y="4" width="14" height="14" rx="2" />
        <rect x="6" y="6" width="10" height="10" fill="#ffffff" />
        <rect x="8" y="8" width="6" height="6" fill="#1e1b4b" />
        <rect x="32" y="4" width="14" height="14" rx="2" />
        <rect x="34" y="6" width="10" height="10" fill="#ffffff" />
        <rect x="36" y="8" width="6" height="6" fill="#1e1b4b" />
        <rect x="4" y="32" width="14" height="14" rx="2" />
        <rect x="6" y="34" width="10" height="10" fill="#ffffff" />
        <rect x="8" y="36" width="6" height="6" fill="#1e1b4b" />
        <!-- Micro dots -->
        <circle cx="24" cy="12" r="2" />
        <circle cx="24" cy="24" r="2.5" />
        <circle cx="16" cy="24" r="2" />
        <circle cx="32" cy="24" r="2" />
        <circle cx="28" cy="36" r="2" />
        <circle cx="40" cy="36" r="2.5" />
      </g>

      <!-- Simulated Barcode in Center -->
      <g transform="translate(62, 8)">
        <rect x="0" y="0" width="130" height="24" fill="#ffffff" />
        <!-- Barcode lines -->
        <g fill="#0f172a">
          <rect x="4" y="2" width="2" height="20" />
          <rect x="8" y="2" width="3" height="20" />
          <rect x="13" y="2" width="1.5" height="20" />
          <rect x="17" y="2" width="3.5" height="20" />
          <rect x="23" y="2" width="2" height="20" />
          <rect x="27" y="2" width="1" height="20" />
          <rect x="30" y="2" width="4" height="20" />
          <rect x="37" y="2" width="2" height="20" />
          <rect x="42" y="2" width="3" height="20" />
          <rect x="47" y="2" width="1.5" height="20" />
          <rect x="52" y="2" width="4" height="20" />
          <rect x="58" y="2" width="2" height="20" />
          <rect x="63" y="2" width="3" height="20" />
          <rect x="69" y="2" width="1" height="20" />
          <rect x="73" y="2" width="4" height="20" />
          <rect x="80" y="2" width="2" height="20" />
          <rect x="85" y="2" width="3" height="20" />
          <rect x="91" y="2" width="1.5" height="20" />
          <rect x="95" y="2" width="4" height="20" />
          <rect x="102" y="2" width="2" height="20" />
          <rect x="107" y="2" width="3" height="20" />
          <rect x="113" y="2" width="2" height="20" />
          <rect x="118" y="2" width="3" height="20" />
          <rect x="124" y="2" width="2" height="20" />
        </g>
        <text x="65" y="32" font-family="monospace" font-size="8" fill="#64748b" text-anchor="middle" letter-spacing="1.5">*102488*</text>
      </g>

      <!-- Golden Seal / Official Examination Stamp (Left) -->
      <g transform="translate(236, 1)" filter="url(#glowStamp)">
        <circle cx="24" cy="24" r="24" fill="none" stroke="url(#goldMetallic)" stroke-width="2.5" />
        <circle cx="24" cy="24" r="20" fill="none" stroke="#d97706" stroke-width="1" stroke-dasharray="3,2" />
        <circle cx="24" cy="24" r="16" fill="url(#goldMetallic)" opacity="0.15" />
        <!-- Emblem text arc simulation -->
        <text x="24" y="16" font-family="'Cairo', sans-serif" font-weight="900" font-size="6" fill="#854d0e" text-anchor="middle">اللجنة الامتحانية</text>
        <path d="M24,20 L25.5,23.5 L29,23.5 L26,25.5 L27,29 L24,27 L21,29 L22,25.5 L19,23.5 L22.5,23.5 Z" fill="url(#goldMetallic)" />
        <text x="24" y="36" font-family="'Cairo', sans-serif" font-weight="900" font-size="6" fill="#854d0e" text-anchor="middle">ختم الإدارة</text>
      </g>
    </g>

  </g>
</svg>
