<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="schedGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.18" />
      <stop offset="50%" stop-color="#0369a1" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="boardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>

    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="goldRibbon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <linearGradient id="clockGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <filter id="cardShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#0284c7" flood-opacity="0.22" />
    </filter>

    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Ambient Backdrop Circle -->
  <circle cx="256" cy="256" r="230" fill="url(#schedGlow)" />

  <!-- Background Decorative Rings -->
  <circle cx="256" cy="256" r="215" fill="none" stroke="#0284c7" stroke-opacity="0.12" stroke-width="2" stroke-dasharray="10 8" />
  <circle cx="256" cy="256" r="190" fill="none" stroke="#0369a1" stroke-opacity="0.08" stroke-width="1.5" />

  <!-- Main Timetable Board (A3 Landscape Perspective) -->
  <g filter="url(#cardShadow)">
    <!-- Base Board Sheet -->
    <rect x="52" y="110" width="408" height="290" rx="20" fill="url(#boardGrad)" stroke="#cbd5e1" stroke-width="2.5" />
    
    <!-- Top Timetable Header Banner -->
    <rect x="52" y="110" width="408" height="58" rx="20" fill="url(#headerGrad)" />
    <!-- Flatten bottom corners of header -->
    <rect x="52" y="148" width="408" height="20" fill="url(#headerGrad)" />

    <!-- Header Grid Lines & Title Mockup -->
    <circle cx="95" cy="139" r="14" fill="#ffffff" fill-opacity="0.2" />
    <path d="M91,139 L99,139 M95,135 L95,143" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
    
    <rect x="125" y="131" width="130" height="8" rx="4" fill="#ffffff" fill-opacity="0.9" />
    <rect x="125" y="145" width="80" height="6" rx="3" fill="#38bdf8" fill-opacity="0.9" />

    <!-- A3 Badge Pill in Header -->
    <rect x="365" y="127" width="75" height="24" rx="12" fill="url(#goldRibbon)" filter="url(#badgeShadow)" />
    <text x="402" y="143" font-family="'Cairo', sans-serif" font-weight="900" font-size="12" fill="#ffffff" text-anchor="middle">A3 عريض</text>

    <!-- Table Grid Layout -->
    <!-- Column Headers (Days / Periods) -->
    <rect x="68" y="180" width="376" height="24" rx="6" fill="#f1f5f9" />
    
    <!-- Day Row Labels & Cells -->
    <!-- Row 1: Sunday -->
    <rect x="68" y="212" width="60" height="28" rx="5" fill="#e0f2fe" stroke="#bae6fd" stroke-width="1" />
    <rect x="134" y="212" width="56" height="28" rx="5" fill="#dbeafe" />
    <rect x="196" y="212" width="56" height="28" rx="5" fill="#fef3c7" />
    <rect x="258" y="212" width="56" height="28" rx="5" fill="#dcfce7" />
    <rect x="320" y="212" width="56" height="28" rx="5" fill="#f3e8ff" />
    <rect x="382" y="212" width="62" height="28" rx="5" fill="#fee2e2" />

    <!-- Row 2: Monday -->
    <rect x="68" y="246" width="60" height="28" rx="5" fill="#e0f2fe" stroke="#bae6fd" stroke-width="1" />
    <rect x="134" y="246" width="56" height="28" rx="5" fill="#fef3c7" />
    <rect x="196" y="246" width="56" height="28" rx="5" fill="#dcfce7" />
    <rect x="258" y="246" width="56" height="28" rx="5" fill="#dbeafe" />
    <rect x="320" y="246" width="56" height="28" rx="5" fill="#fee2e2" />
    <rect x="382" y="246" width="62" height="28" rx="5" fill="#f3e8ff" />

    <!-- Row 3: Tuesday -->
    <rect x="68" y="280" width="60" height="28" rx="5" fill="#e0f2fe" stroke="#bae6fd" stroke-width="1" />
    <rect x="134" y="280" width="56" height="28" rx="5" fill="#dcfce7" />
    <rect x="196" y="280" width="56" height="28" rx="5" fill="#dbeafe" />
    <rect x="258" y="280" width="56" height="28" rx="5" fill="#f3e8ff" />
    <rect x="320" y="280" width="56" height="28" rx="5" fill="#fef3c7" />
    <rect x="382" y="280" width="62" height="28" rx="5" fill="#dbeafe" />

    <!-- Row 4: Wednesday -->
    <rect x="68" y="314" width="60" height="28" rx="5" fill="#e0f2fe" stroke="#bae6fd" stroke-width="1" />
    <rect x="134" y="314" width="56" height="28" rx="5" fill="#f3e8ff" />
    <rect x="196" y="314" width="56" height="28" rx="5" fill="#fee2e2" />
    <rect x="258" y="314" width="56" height="28" rx="5" fill="#fef3c7" />
    <rect x="320" y="314" width="56" height="28" rx="5" fill="#dcfce7" />
    <rect x="382" y="314" width="62" height="28" rx="5" fill="#fef3c7" />

    <!-- Row 5: Thursday -->
    <rect x="68" y="348" width="60" height="28" rx="5" fill="#e0f2fe" stroke="#bae6fd" stroke-width="1" />
    <rect x="134" y="348" width="56" height="28" rx="5" fill="#dbeafe" />
    <rect x="196" y="348" width="56" height="28" rx="5" fill="#f3e8ff" />
    <rect x="258" y="348" width="56" height="28" rx="5" fill="#dcfce7" />
    <rect x="320" y="348" width="56" height="28" rx="5" fill="#fee2e2" />
    <rect x="382" y="348" width="62" height="28" rx="5" fill="#dbeafe" />

    <!-- Micro Subject Pill Shapes inside grid -->
    <circle cx="150" cy="226" r="4" fill="#2563eb" />
    <rect x="160" y="224" width="22" height="4" rx="2" fill="#2563eb" />

    <circle cx="212" cy="226" r="4" fill="#d97706" />
    <rect x="222" y="224" width="22" height="4" rx="2" fill="#d97706" />

    <circle cx="274" cy="226" r="4" fill="#16a34a" />
    <rect x="284" y="224" width="22" height="4" rx="2" fill="#16a34a" />

    <circle cx="336" cy="226" r="4" fill="#9333ea" />
    <rect x="346" y="224" width="22" height="4" rx="2" fill="#9333ea" />

    <circle cx="398" cy="226" r="4" fill="#dc2626" />
    <rect x="408" y="224" width="26" height="4" rx="2" fill="#dc2626" />
  </g>

  <!-- 3D Floating School Bell / Clock Widget -->
  <g transform="translate(390, 68)" filter="url(#badgeShadow)">
    <circle cx="35" cy="35" r="32" fill="url(#clockGrad)" stroke="#ffffff" stroke-width="3" />
    <circle cx="35" cy="35" r="26" fill="#ffffff" />
    <!-- Clock Hands (Quarter past 8 - Morning Period 1) -->
    <circle cx="35" cy="35" r="3" fill="#0369a1" />
    <line x1="35" y1="35" x2="35" y2="19" stroke="#0369a1" stroke-width="2.5" stroke-linecap="round" />
    <line x1="35" y1="35" x2="47" y2="35" stroke="#e11d48" stroke-width="2" stroke-linecap="round" />
    <!-- Clock Ticks -->
    <circle cx="35" cy="13" r="1.5" fill="#94a3b8" />
    <circle cx="57" cy="35" r="1.5" fill="#94a3b8" />
    <circle cx="35" cy="57" r="1.5" fill="#94a3b8" />
    <circle cx="13" cy="35" r="1.5" fill="#94a3b8" />
  </g>

  <!-- Floating Graduation Cap at Bottom Left -->
  <g transform="translate(32, 350)" filter="url(#badgeShadow)">
    <!-- Mortarboard Diamond -->
    <polygon points="45,10 85,25 45,40 5,25" fill="#0f172a" />
    <polygon points="45,13 80,25 45,37 10,25" fill="#1e293b" />
    <!-- Cap Skull Cap -->
    <path d="M22,32 L22,46 C22,54 68,54 68,46 L68,32 Z" fill="#0f172a" />
    <!-- Golden Tassel -->
    <circle cx="45" cy="25" r="3" fill="#f59e0b" />
    <path d="M45,25 C55,27 62,35 62,45" fill="none" stroke="#f59e0b" stroke-width="2" />
    <polygon points="60,45 64,45 65,56 59,56" fill="#d97706" />
  </g>

  <!-- Golden Stars of Excellence -->
  <g fill="#f59e0b" filter="url(#badgeShadow)">
    <polygon points="445,360 448,367 456,368 450,373 452,381 445,377 438,381 440,373 434,368 442,367" />
    <polygon points="75,80 77,84 82,85 78,88 79,93 75,90 71,93 72,88 68,85 73,84" />
  </g>
</svg>
