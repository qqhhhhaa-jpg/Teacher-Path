    <circle cx="48" cy="46" r="3" fill="#ffffff"/>
    <circle cx="56" cy="46" r="3" fill="#ffffff" opacity="0.6"/>
    <circle cx="64" cy="46" r="3" fill="#ffffff" opacity="0.4"/>
