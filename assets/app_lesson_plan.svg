<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="l_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fce7f3"/>
      <stop offset="100%" stop-color="#fbcfe8"/>
    </linearGradient>
    <linearGradient id="l_book1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#be185d"/>
    </linearGradient>
    <linearGradient id="l_book2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="l_book3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="l_shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#ec4899" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect x="15" y="15" width="130" height="130" rx="36" fill="url(#l_bg)"/>
  <!-- 3D Stack of 3 Books -->
  <g filter="url(#l_shadow)">
    <!-- Book 3 (Bottom - Blue) -->
    <rect x="36" y="98" width="88" height="18" rx="5" fill="url(#l_book3)"/>
    <rect x="42" y="102" width="76" height="10" rx="2" fill="#ffffff"/>

    <!-- Book 2 (Middle - Purple) -->
    <rect x="40" y="78" width="80" height="18" rx="5" fill="url(#l_book2)"/>
    <rect x="46" y="82" width="68" height="10" rx="2" fill="#ffffff"/>

    <!-- Book 1 (Top - Rose) -->
    <rect x="44" y="58" width="72" height="18" rx="5" fill="url(#l_book1)"/>
    <rect x="50" y="62" width="60" height="10" rx="2" fill="#ffffff"/>

    <!-- Bookmark hanging from top book -->
    <path d="M96 58 L96 82 L102 76 L108 82 L108 58 Z" fill="#f59e0b"/>

    <!-- Open Quill / Bookmark Ribbon on Top -->
    <circle cx="62" cy="46" r="10" fill="#ffffff" stroke="#fbcfe8" stroke-width="2"/>
    <path d="M58 46 L61 49 L67 43" fill="none" stroke="#ec4899" stroke-width="2.5" stroke-linecap="round"/>
  </g>
</svg>