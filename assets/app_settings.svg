    <path d="M16 11 L18 11 L18.5 13 L20.5 13.8 L22 12.5 L23.5 14 L22.2 15.5 L23 17.5 L25 18 L25 20 L23 20.5 L22.2 22.5 L23.5 24 L22 25.5 L20.5 24.2 L18.5 25 L18 27 L16 27 L15.5 25 L13.5 24.2 L12 25.5 L10.5 24 L11.8 22.5 L11 20.5 L9 20 L9 18 L11 17.5 L11.8 15.5 L10.5 14 L12 12.5 L13.5 13.8 L15.5 13 Z" fill="#ffffff"/>
    <circle cx="16" cy="19" r="4" fill="url(#s_accent)"/>
