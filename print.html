<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>معاينة وطباعة المستند الرسمي - مسار المعلم</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Tajawal:wght@500;700;800;900&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
  
  <!-- Icons & Math Engine -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
  
  <!-- Local Styles -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/print.css">

  <style id="dynamicPageStyle">
    @page {
      size: A4 portrait;
      margin: 8mm 10mm;
    }
  </style>

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      -webkit-print-color-adjust: exact !important;
      print-color-adjust: exact !important;
      color-adjust: exact !important;
    }

    html, body {
      margin: 0;
      padding: 0;
      background: #0b1329;
      color: #0f172a;
      font-family: 'Cairo', 'Tajawal', system-ui, -apple-system, sans-serif;
      direction: rtl;
      min-height: 100vh;
    }

    /* Screen UI: Teacher Command Bar */
    @media screen {
      .print-window-navbar {
        position: sticky;
        top: 0;
        left: 0;
        right: 0;
        background: #0f172a;
        color: #ffffff;
        padding: 12px 24px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        box-shadow: 0 4px 25px rgba(0,0,0,0.45);
        z-index: 9999999;
        border-bottom: 2px solid #0284c7;
      }

      .print-nav-info {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .print-nav-icon {
        width: 40px;
        height: 40px;
        border-radius: 10px;
        background: linear-gradient(135deg, #0284c7, #0d9488);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.25rem;
        color: #ffffff;
        box-shadow: 0 4px 12px rgba(2, 132, 199, 0.4);
      }

      .print-nav-title {
        font-weight: 900;
        font-size: 1.05rem;
        color: #f8fafc;
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .print-nav-badge {
        background: rgba(56, 189, 248, 0.15);
        color: #38bdf8;
        border: 1px solid rgba(56, 189, 248, 0.35);
        font-size: 0.74rem;
        padding: 3px 10px;
        border-radius: 999px;
        font-weight: 700;
      }

      .print-nav-actions {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .btn-nav-print {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        background: linear-gradient(135deg, #0284c7, #026ca3);
        color: #ffffff;
        border: none;
        padding: 9px 22px;
        border-radius: 10px;
        font-weight: 800;
        font-size: 0.92rem;
        cursor: pointer;
        box-shadow: 0 4px 14px rgba(2, 132, 199, 0.45);
        transition: all 0.2s ease;
      }

      .btn-nav-print:hover {
        transform: translateY(-1px);
        background: linear-gradient(135deg, #0369a1, #02527d);
        box-shadow: 0 6px 18px rgba(2, 132, 199, 0.6);
      }

      .btn-nav-close {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        background: #334155;
        color: #f1f5f9;
        border: none;
        padding: 9px 18px;
        border-radius: 10px;
        font-weight: 700;
        font-size: 0.92rem;
        cursor: pointer;
        transition: all 0.2s ease;
      }

      .btn-nav-close:hover {
        background: #475569;
        color: #ffffff;
      }

      .print-stage-area {
        padding: 36px 20px 80px 20px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        width: 100%;
        overflow-x: auto;
      }

      .print-stage-content {
        background: #ffffff;
        box-shadow: 0 15px 50px rgba(0,0,0,0.55);
        border-radius: 4px;
        width: fit-content;
        max-width: 100%;
      }
    }

    /* Print Paper Mode */
    @media print {
      .print-window-navbar {
        display: none !important;
      }

      html, body {
        background: #ffffff !important;
      }

      .print-stage-area {
        padding: 0 !important;
        margin: 0 !important;
        display: block !important;
        width: 100% !important;
      }

      .print-stage-content {
        box-shadow: none !important;
        border-radius: 0 !important;
        margin: 0 !important;
        padding: 0 !important;
        width: 100% !important;
      }
    }
  </style>
</head>
<body>

  <!-- Top Action Navbar (يبقى مفتوحاً بالمتصفح ويحتوي على زر الطباعة والإغلاق) -->
  <header class="print-window-navbar">
    <div class="print-nav-info">
      <div class="print-nav-icon">
        <i class="fa-solid fa-print"></i>
      </div>
      <div>
        <div class="print-nav-title">
          <span id="pageNavTitle">المستند الرسمي المعتمد للطباعة</span>
          <span class="print-nav-badge" id="pageNavBadge">A4 رسمي</span>
        </div>
        <small style="color: #94a3b8; font-size: 0.78rem;">نافذة طباعة ومعاينة مستقلة • تبقى مفتوحة لحين إغلاقها من قبلك</small>
      </div>
    </div>

    <div class="print-nav-actions">
      <button type="button" class="btn-nav-print" onclick="window.print()">
        <i class="fa-solid fa-print"></i>
        <span>بدء الطباعة الآن</span>
      </button>
      <button type="button" class="btn-nav-close" onclick="window.close()">
        <i class="fa-solid fa-xmark"></i>
        <span>إغلاق التبويب</span>
      </button>
    </div>
  </header>

  <!-- Document Stage Canvas -->
  <main class="print-stage-area">
    <div class="print-stage-content" id="printStageContent">
      <div style="padding: 3rem; text-align: center; color: #64748b; font-size: 1.1rem;">
        <i class="fa-solid fa-spinner fa-spin fa-2x" style="color: #0284c7; margin-bottom: 1rem; display: block;"></i>
        جاري تحميل وتجهيز المستند للطباعة والمعاينة...
      </div>
    </div>
  </main>

  <!-- KaTeX Math Rendering Engine -->
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>

  <script>
    (function () {
      try {
        var rawPayload = localStorage.getItem('masar_print_payload') || sessionStorage.getItem('masar_print_payload');
        if (!rawPayload) {
          document.getElementById('printStageContent').innerHTML = `
            <div style="padding: 3rem 2rem; text-align: center; font-family: 'Cairo', sans-serif;">
              <i class="fa-solid fa-circle-exclamation fa-3x" style="color: #f59e0b; margin-bottom: 1rem;"></i>
              <h2 style="font-size: 1.3rem; color: #0f172a; margin-bottom: 0.5rem;">لم يتم العثور على مستند للطباعة!</h2>
              <p style="color: #64748b; font-size: 0.95rem;">يرجى الرجوع لمنصة «مسار المعلم» والضغط على زر الطباعة من داخل المنصة.</p>
              <button type="button" class="btn-nav-print" style="margin-top: 1rem;" onclick="window.close()">إغلاق النافذة</button>
            </div>
          `;
          return;
        }

        var payload = JSON.parse(rawPayload);
        var title = payload.title || 'طباعة مستند رسمي - مسار المعلم';
        var content = payload.content || '';
        var options = payload.options || {};
        var orientation = options.orientation || 'portrait';
        var pageSize = options.pageSize || 'A4';
        var margin = options.margin || (orientation === 'landscape' ? '6mm 8mm' : '8mm 10mm');

        // 1. Update Title and Badges
        document.title = title;
        document.getElementById('pageNavTitle').innerText = title;
        document.getElementById('pageNavBadge').innerText = pageSize + ' ' + (orientation === 'landscape' ? 'أفقي (عريض)' : 'عمودي');

        // 2. Set dynamic @page CSS
        var styleEl = document.getElementById('dynamicPageStyle');
        if (styleEl) {
          styleEl.innerHTML = '@page { size: ' + pageSize + ' ' + orientation + '; margin: ' + margin + '; }';
        }

        if (options.extraStyles) {
          var extraEl = document.createElement('style');
          extraEl.innerHTML = options.extraStyles;
          document.head.appendChild(extraEl);
        }

        // 3. Render Content
        var stage = document.getElementById('printStageContent');
        stage.innerHTML = content;

        // 4. Trigger print automatically after fonts settle (stays open!)
        setTimeout(function () {
          window.print();
        }, 500);

      } catch (e) {
        console.error('Error rendering print payload:', e);
      }
    })();
  </script>
</body>
</html>
